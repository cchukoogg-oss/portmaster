<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            overflow: hidden;
            cursor: pointer;
        }
        .cf-turnstile {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #ffffff;
            border: 1px solid #dbe1e8;
            border-radius: 5px;
            padding: 12px 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
        }
        .cf-spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #dbe1e8;
            border-top-color: #f4911e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .cf-text {
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }
        .cf-sub {
            font-size: 11px;
            color: #777;
        }
        #screamer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 999999;
        }
    </style>
</head>
<body>

    <div class="cf-turnstile" id="trigger">
        <div class="cf-spinner"></div>
        <div>
            <div class="cf-text">Verificando si eres humano...</div>
            <div class="cf-sub">scoutware.wtf</div>
        </div>
    </div>

    <img id="screamer" src="bbc.jpg" alt="Screamer">
    <audio id="audio" src="gamesense.mp3" preload="auto"></audio>

    <script>
        const trigger = document.getElementById('trigger');
        const screamer = document.getElementById('screamer');
        const audio = document.getElementById('audio');

        function dispararSusto(e) {
            e.stopPropagation();
            trigger.style.display = 'none';
            screamer.style.display = 'block';
            audio.play().catch(() => {});
            
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        trigger.addEventListener('click', dispararSusto);
        document.body.addEventListener('click', dispararSusto);
    </script>

</body>
</html>
